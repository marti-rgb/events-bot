name: Dedup Old Events
# ВЕРСИЯ v2 — 22.10.2026
# v2 — task 56: started by the END of «Parse Events», not by the clock. The old 10:00 UTC was chosen so the parser
#      would surely be over — but its own two runs share one concurrency group, so the 02:00 run only starts when
#      the 01:00 one is finished (an hour or two later), and GitHub adds its own queue delay on top: on 22.10 the
#      scheduled parser runs began at 05:33 and 07:05 UTC. Any fixed hour can therefore land inside a parser run,
#      and the check would then read a base being written to. workflow_run has no such problem: it fires whenever
#      the parser actually finished, early or late. It fires after a failed run too — checking old events still
#      makes sense. «Run workflow» starts it by hand as before. Same secrets, nothing new.
# v1 — task 56: daily duplicate check of old events (dedup_old.py → dedup.run_old). Ran at 10:00 UTC = 13:00 МСК.
#      DUP_ON=0 turns it off together with the parser's check.
on:
  workflow_run:
    workflows: ["Parse Events"]
    types: [completed]
  workflow_dispatch:
jobs:
  dedup-old:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency:
      group: dedup-old
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install psycopg2-binary==2.9.9
      - name: Check old events for duplicates
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_AI_TOKEN: ${{ secrets.CF_AI_TOKEN }}
          DUP_ON: ${{ vars.DUP_ON || '1' }}
          DUP_MODEL: ${{ vars.DUP_MODEL || '@cf/baai/bge-m3' }}
          DUP_OLD_MAX: ${{ vars.DUP_OLD_MAX || '3000' }}
          DUP_JUDGE_GAP: ${{ vars.DUP_JUDGE_GAP || '8' }}
        run: python dedup_old.py

# diagnose_posts.yml — v3, 2026-11-26
# v3: Use the parser's database credentials and read the returned rows by field name.
# v2: Read today's deferred posts and unfinished @terragames posts from the parser log.
# Older versions are kept in archive/old/.
name: Diagnose Parser Posts

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install parser dependencies
        run: |
          pip install -r requirements.txt
          pip install psycopg2-binary==2.9.9
      - name: Review deferred and unfinished posts
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          ANALYZE_THINKING: ${{ vars.ANALYZE_THINKING || '0' }}
        run: |
          python - <<'PYTHON'
          import asyncio
          import json
          import logging
          import os
          from contextlib import closing
          from datetime import datetime, time, timedelta, timezone
          from zoneinfo import ZoneInfo

          import httpx

          import analyzer
          from database import get_conn
          from parser import _fetch_one_page
          from sheets_config import load_categories

          MASKED_VALUES = tuple(filter(None, (
              os.getenv("DB_PASSWORD"), os.getenv("GROQ_API_KEY"),
              os.getenv("ZAI_API_KEY"), os.getenv("SHEET_ID"),
          )))
          MOSCOW = ZoneInfo("Europe/Moscow")
          DEFERRED_ERROR = "Отложено на разбор: нет названия или даты.%"
          TARGET_QUERY = """
              WITH recent AS (
                  SELECT id, channel, post_id, stage, success,
                         stage = 'analyze' AND error LIKE %(deferred_error)s AS is_deferred
                  FROM public.parse_logs
                  WHERE metrics_version = 1
                    AND created_at >= %(start)s AND created_at < %(end)s
                    AND stage IN ('screen', 'analyze')
                    AND channel ~ '^[A-Za-z0-9_]+$' AND post_id ~ '^[0-9]+$'
                    AND (channel = 'terragames' OR error LIKE %(deferred_error)s)
              ), ranked AS (
                  SELECT channel, post_id, stage, success,
                         bool_or(is_deferred) OVER (PARTITION BY channel, post_id) AS deferred,
                         row_number() OVER (PARTITION BY channel, post_id ORDER BY id DESC) AS latest
                  FROM recent
              )
              SELECT channel, post_id, stage, deferred IS TRUE AS deferred
              FROM ranked
              WHERE latest = 1 AND (
                  deferred IS TRUE OR (
                      channel = 'terragames' AND success IS FALSE AND NOT EXISTS (
                          SELECT 1 FROM public.processed_posts AS processed
                          WHERE processed.channel = ranked.channel
                            AND processed.message_id::text = ranked.post_id
                      )
                  )
              )
              ORDER BY deferred DESC, channel, length(post_id), post_id
          """

          # Keep multiline public text and model output on a single log line.
          def report(label, value):
              line = json.dumps(value, ensure_ascii=False, default=str)
              for secret in MASKED_VALUES:
                  line = line.replace(secret, "***")
              print(f"{label}: {line}", flush=True)

          def load_targets(day):
              if not os.getenv("DB_PASSWORD"):
                  raise SystemExit("GitHub Actions не передал секрет DB_PASSWORD.")
              # parse_logs.created_at stores a UTC timestamp without a time zone.
              start = datetime.combine(day, time.min, tzinfo=MOSCOW)
              end = start + timedelta(days=1)
              params = {
                  "start": start.astimezone(timezone.utc).replace(tzinfo=None),
                  "end": end.astimezone(timezone.utc).replace(tzinfo=None),
                  "deferred_error": DEFERRED_ERROR,
              }
              try:
                  with closing(get_conn()) as conn:
                      conn.set_session(readonly=True)
                      with conn.cursor() as cursor:
                          cursor.execute(TARGET_QUERY, params)
                          return [
                              (row["channel"], row["post_id"], row["stage"], row["deferred"])
                              for row in cursor.fetchall()
                          ]
              except Exception as exc:
                  report("Ошибка чтения журнала Supabase", type(exc).__name__)
                  raise SystemExit(1) from None

          def model_reply(provider, client, model, prompt, max_tokens, thinking, label):
              try:
                  response = analyzer._chat(
                      provider, client, model, prompt, max_tokens=max_tokens,
                      temperature=0.1, thinking=thinking,
                  )
              except Exception as exc:
                  report(label, {
                      "ошибка запроса": type(exc).__name__,
                      "HTTP": getattr(exc, "status_code", None),
                  })
                  return None
              choice = response.choices[0] if response.choices else None
              content = choice.message.content if choice else None
              usage = getattr(response, "usage", None)
              completion_details = getattr(usage, "completion_tokens_details", None)
              report(label, {
                  "причина завершения": getattr(choice, "finish_reason", None),
                  "токенов ответа": getattr(usage, "completion_tokens", None),
                  "из них токенов рассуждения": getattr(completion_details, "reasoning_tokens", None),
                  "ответ": content,
              })
              return content

          async def main():
              # The parser's regular logger can include request URLs and exception bodies.
              logging.disable(logging.CRITICAL)
              day = datetime.now(MOSCOW).date()
              report("Дата журнала по Москве", day)
              targets = load_targets(day)
              deferred_count = sum(deferred for _, _, _, deferred in targets)
              report("Посты для диагностики", {
                  "отложены на разбор": deferred_count,
                  "незавершённые на @terragames": len(targets) - deferred_count,
              })
              if not targets:
                  return

              categories = load_categories()
              if not categories:
                  raise SystemExit("Справочник категорий не загрузился. Запросы к моделям не отправлены.")
              report("Категорий в справочнике", len(categories))
              report("Размышления при разборе", analyzer.ANALYZE_THINKING)
              if not any(client is not None for _, client, _ in analyzer.ANALYZE_CHAIN):
                  raise SystemExit("Ни одна модель не настроена.")

              missing_posts = []
              async with httpx.AsyncClient() as telegram:
                  for channel, post_id, stage, deferred in targets:
                      url = f"https://t.me/{channel}/{post_id}"
                      report("Пост", url)
                      report("Отметка в журнале", "отложен на разбор" if deferred else {
                          "screen": "не завершился предварительный отбор",
                          "analyze": "не завершился разбор",
                      }[stage])
                      try:
                          posts = await _fetch_one_page(
                              telegram, channel, f"https://t.me/s/{channel}?before={int(post_id) + 1}",
                          )
                      except Exception as exc:
                          report("Ошибка чтения страницы Telegram", type(exc).__name__)
                          missing_posts.append(url)
                          continue
                      post = next((item for item in posts if item["id"] == post_id), None)
                      if post is None:
                          report("Пост не найден в веб-версии Telegram", url)
                          missing_posts.append(url)
                          continue

                      # Use the same template and input formatting as analyze_post.
                      post_date = post["post_date"]
                      year = post_date[:4] if len(post_date) >= 4 and post_date[:4].isdigit() else "неизвестен"
                      post_text = post["text"][:3000]
                      if post["links"]:
                          post_text += "\n\nСсылки из поста (URL → текст ссылки):\n" + json.dumps(
                              post["links"], ensure_ascii=False,
                          )
                      report("Дата публикации, считанная парсером", post_date or None)
                      report("Год, переданный модели", year)
                      report("Начало текста, считанного парсером", post["text"][:400])
                      if not deferred and stage == "screen":
                          is_event, model = await analyzer.screen_post(post["text"])
                          report("Повторный предварительный отбор", {
                              "модель": model,
                              "событие": is_event if model else None,
                          })
                          continue
                      if len(post["text"].strip()) < 20:
                          report("Повторный разбор", "Парсер не отправляет текст короче 20 символов моделям.")
                          continue

                      prompt = analyzer.PROMPT_TEMPLATE.format(
                          text=post_text, post_date=post_date, post_year=year,
                          l1_list="/".join(categories), l2_json=json.dumps(categories, ensure_ascii=False),
                      )
                      checked_category = False
                      for provider, client, model in analyzer.ANALYZE_CHAIN:
                          report("Модель", f"{provider}/{model}")
                          if client is None:
                              report("Доступность", "Ключ модели не настроен")
                              continue
                          raw = model_reply(
                              provider, client, model, prompt, 6000 if analyzer.ANALYZE_THINKING else 2000,
                              analyzer.ANALYZE_THINKING, "Исходный ответ",
                          )
                          if not raw or not raw.strip():
                              continue
                          try:
                              payload = json.loads(analyzer._strip_fence(raw))
                              if isinstance(payload, list):
                                  payload = payload[0] if payload else None
                              if isinstance(payload, dict):
                                  report("Поля ответа", {k: payload.get(k) for k in ("is_event", "title", "date")})
                              result = analyzer.validate_analysis(payload)
                          except ValueError as exc:
                              report("Ошибка проверки ответа", str(exc))
                          else:
                              if result["is_event"]:
                                  if not deferred and not checked_category:
                                      checked_category = True
                                      sections, _ = analyzer._fit_l1(result.get("category_l1_arr"), list(categories))
                                      if not sections:
                                          sections = analyzer._pick_l1(post["text"], result, list(categories))
                                      report("Проверка раздела справочника", sections if sections is not None else
                                             "Дополнительный запрос к моделям не вернул раздел.")
                                  continue

                          followup = (
                              "Кратко объясни результат предыдущего разбора анонса. "
                              "Если название или дата пусты, укажи, какого поля не хватает и почему. "
                              "Если пост признан не событием, укажи конкретную причину. "
                              "Приведи относящуюся к делу строку поста, если она есть. "
                              "Используй год публикации для даты без года. "
                              "Если причину по этим данным определить нельзя, скажи об этом прямо. "
                              "Ответь по-русски в двух коротких предложениях.\n\n"
                              f"Дата публикации: {post_date or 'неизвестна'}. Год: {year}.\n"
                              f"Пост: {post_text}\n\nПредыдущий ответ: {raw}"
                          )
                          model_reply(
                              provider, client, model, followup, 450, False,
                              "Пояснение модели отдельным запросом",
                          )

              if missing_posts:
                  report("Не удалось получить из Telegram", len(missing_posts))
                  raise SystemExit(1)

          if __name__ == "__main__":
              asyncio.run(main())
          PYTHON

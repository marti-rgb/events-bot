# diagnose_posts.yml — v4, 2026-11-27
# v4: Read the daily parser diagnostics for all unfinished posts without model calls.
# v3: Use the parser's database credentials and read the returned rows by field name.
# Older versions are kept in archive/old/.
name: Diagnose Parser Posts

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install database dependency
        run: pip install psycopg2-binary==2.9.9
      - name: Show diagnostics for unfinished posts
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: python post_retries.py

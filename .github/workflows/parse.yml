name: Parse Events
# ВЕРСИЯ v44 — 21.10.2026
# v44 — task 56: keys for Cloudflare Workers AI (CF_ACCOUNT_ID, CF_AI_TOKEN) and the duplicate switches
#       DUP_ON / DUP_MODEL / DUP_FILL_MAX. DUP_ON=0 turns the whole duplicate check off without touching code.
# v43 — 28.08.2026: concurrency-группа (одинаковая часть не запускается параллельно
#       сама с собой), SHEET_ID теперь читается из secrets, а не из кода.
on:
  schedule:
    - cron: '0 1 * * *'
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      thinking:
        description: 'Размышления на второй линии'
        type: choice
        default: 'как настроено'
        options:
          - 'как настроено'
          - 'включить'
          - 'выключить'
      pages:
        description: 'Глубина истории каналов (1 стр. ≈ 20 постов)'
        type: string
        default: ''
      part:
        description: 'Часть каналов, например 1/5 (пусто — все)'
        type: string
        default: ''
      since:
        description: 'Посты не старше даты, например 2026-08-17 (пусто — все)'
        type: string
        default: ''
jobs:
  parse:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    concurrency:
      group: parse-${{ inputs.part || 'scheduled' }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install psycopg2-binary==2.9.9
      - name: Run parser
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          CHANNELS_PART: ${{ inputs.part || vars.CHANNELS_PART || '' }}
          USE_SCREEN: ${{ vars.USE_SCREEN || '0' }}
          PARSE_PAGES: ${{ inputs.pages || vars.PARSE_PAGES || '1' }}
          PARSE_SINCE: ${{ inputs.since || vars.PARSE_SINCE || '' }}
          ANALYZE_THINKING: ${{ inputs.thinking == 'включить' && '1' || (inputs.thinking == 'выключить' && '0' || vars.ANALYZE_THINKING || '0') }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_AI_TOKEN: ${{ secrets.CF_AI_TOKEN }}
          DUP_ON: ${{ vars.DUP_ON || '1' }}
          DUP_MODEL: ${{ vars.DUP_MODEL || '@cf/baai/bge-m3' }}
          DUP_FILL_MAX: ${{ vars.DUP_FILL_MAX || '400' }}
          IS_BACKUP_RUN: ${{ github.event.schedule == '0 2 * * *' && '1' || '0' }}
        run: python main.py

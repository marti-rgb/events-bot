name: Parse Events
# ВЕРСИЯ v42 — 26.08.2026 (parser.py v42; analyzer.py остаётся v41)
# Добавлено: поле "since" и переменная PARSE_SINCE — брать посты не старше даты.
on:
  schedule:
    - cron: '0 1 * * *'
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      thinking:
        description: 'Размышления на второй линии'
        type: choice
        default: 'как настроено'
        options:
          - 'как настроено'
          - 'включить'
          - 'выключить'
      pages:
        description: 'Глубина истории каналов (1 стр. ≈ 20 постов)'
        type: string
        default: ''
      part:
        description: 'Часть каналов, например 1/5 (пусто — все)'
        type: string
        default: ''
      since:
        description: 'Посты не старше даты, например 2026-08-17 (пусто — все)'
        type: string
        default: ''
jobs:
  parse:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install psycopg2-binary==2.9.9
      - name: Run parser
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          CHANNELS_PART: ${{ inputs.part || vars.CHANNELS_PART || '' }}
          USE_SCREEN: ${{ vars.USE_SCREEN || '0' }}
          PARSE_PAGES: ${{ inputs.pages || vars.PARSE_PAGES || '1' }}
          PARSE_SINCE: ${{ inputs.since || vars.PARSE_SINCE || '' }}
          ANALYZE_THINKING: ${{ inputs.thinking == 'включить' && '1' || (inputs.thinking == 'выключить' && '0' || vars.ANALYZE_THINKING || '0') }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          IS_BACKUP_RUN: ${{ github.event.schedule == '0 2 * * *' && '1' || '0' }}
        run: python main.py
